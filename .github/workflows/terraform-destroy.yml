name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter DESTROY to apply the destroy plan; any other value runs plan only
        required: true
        default: PLAN_ONLY

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: Plan or destroy validation environment
    runs-on: ubuntu-latest
    environment: terraform-production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: Copy-Item backend.tf.example backend.tf
        shell: pwsh
      - run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
      - run: terraform plan -destroy -input=false -lock-timeout=5m -out=tfplan-destroy
      - name: Apply reviewed destroy plan
        if: inputs.confirmation == 'DESTROY'
        run: terraform apply -input=false tfplan-destroy
